<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>아마따 스플래시 v0 — saeboman</title>
<style>
  :root {
    --bg: #FFF4E6;
    --ink: #1a1a1a;
    --citrus: #E0E446;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: -apple-system, "SF Pro Text", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink);
    background: #2a2a2a;
    display: grid;
    place-items: center;
  }

  .phone {
    width: 390px;
    height: 844px;
    background: var(--bg);
    border-radius: 48px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 30px 80px rgba(0,0,0,.4), 0 0 0 8px #111;
    cursor: pointer;
    user-select: none;
  }

  .stage {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
  }

  .wordmark {
    display: flex;
    align-items: baseline;
    gap: 0;
    font-size: 88px;
    font-weight: 800;
    letter-spacing: -0.04em;
    position: relative;
  }

  .a, .matta {
    opacity: 0;
    display: inline-block;
  }

  /* the bouncing character sits ABOVE the 아! character */
  .char {
    position: absolute;
    width: 130px;
    height: auto;
    left: -10px;       /* horizontally hovers above the 아! */
    bottom: 95px;      /* sit on top of 아! */
    opacity: 0;
    transform: translateY(-220px) scale(.9);
    transform-origin: 50% 100%;
    pointer-events: none;
  }

  /* hint at bottom */
  .hint {
    position: absolute;
    left: 0; right: 0; bottom: 36px;
    text-align: center;
    font-size: 13px;
    color: #888;
    letter-spacing: 0.04em;
    opacity: 0;
    animation: hintIn 400ms ease 2400ms forwards;
  }
  @keyframes hintIn { to { opacity: 1; } }

  /* ====== animation sequence ====== */
  /* Triggered by adding .play */
  .play .a {
    animation: aFadeIn 220ms cubic-bezier(.2,.8,.2,1) 100ms forwards;
  }
  .play .char {
    animation:
      charDrop 420ms cubic-bezier(.34, 1.56, .4, 1) 360ms forwards,
      charBounce1 280ms cubic-bezier(.34, 1.56, .4, 1) 780ms forwards,
      charBounce2 220ms cubic-bezier(.34, 1.56, .4, 1) 1060ms forwards,
      charSettle 360ms cubic-bezier(.2,.8,.2,1) 1320ms forwards;
  }
  .play .matta {
    animation: mattaIn 320ms cubic-bezier(.2,.8,.2,1) 1180ms forwards;
  }

  @keyframes aFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes charDrop {
    0%   { opacity: 0; transform: translateY(-220px) scale(.9) rotate(-6deg); }
    60%  { opacity: 1; transform: translateY(8px) scale(1.05, .92) rotate(2deg); }
    100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
  }
  @keyframes charBounce1 {
    0%   { transform: translateY(0) scale(1); }
    50%  { transform: translateY(-46px) scale(.98, 1.03); }
    100% { transform: translateY(0) scale(1.04, .94); }
  }
  @keyframes charBounce2 {
    0%   { transform: translateY(0) scale(1.04, .94); }
    50%  { transform: translateY(-20px) scale(.99, 1.02); }
    100% { transform: translateY(0) scale(1) ; }
  }
  @keyframes charSettle {
    0%   { transform: translateY(0) scale(1); }
    40%  { transform: translateY(0) scale(1.06); }
    100% { transform: translateY(0) scale(1); }
  }

  @keyframes mattaIn {
    from { opacity: 0; transform: translateX(-12px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* tap-to-replay flash */
  .pulse {
    position: absolute; inset: 0; border-radius: 48px; pointer-events: none;
    box-shadow: inset 0 0 0 0 rgba(224,228,70,.0);
    transition: box-shadow 180ms ease;
  }
  .phone:active .pulse { box-shadow: inset 0 0 0 6px rgba(224,228,70,.4); }
</style>
</head>
<body>
  <div class="phone" id="phone" title="탭하면 리플레이">
    <div class="stage">
      <div class="wordmark">
        <span class="a">아!</span>
        <img class="char" src="../design/characters-export/citrus_green.png" alt="" />
        <span class="matta">마따</span>
      </div>
    </div>
    <div class="hint">탭해서 리플레이 · saeboman v0</div>
    <div class="pulse"></div>
  </div>

<script>
  const phone = document.getElementById('phone');
  function play() {
    phone.classList.remove('play');
    // force reflow so animation restarts
    void phone.offsetWidth;
    phone.classList.add('play');
  }
  phone.addEventListener('click', play);
  // autoplay on load
  window.addEventListener('load', () => setTimeout(play, 200));
</script>
</body>
</html>
