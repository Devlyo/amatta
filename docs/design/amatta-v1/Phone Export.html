<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1100, initial-scale=1"/>
<title>아마따 일간뷰 — Export</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"/>

<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  body {
    font-family: 'Pretendard', -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 28px;
  }
  .row {
    display: flex; gap: 32px; align-items: flex-start; justify-content: center;
  }
  .col { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .label {
    font-size: 11px; font-weight: 700; color: rgba(28,26,23,0.55);
    letter-spacing: -0.2px; font-family: ui-monospace, monospace;
  }
  /* shrink each phone to ~0.55 so two fit side by side in screenshot viewport.
     The DOM still renders at native 402x874 so layout is unaffected. */
  .scaled { transform: scale(0.55); transform-origin: top center; }
  .scaled-wrap { width: 222px; height: 490px; overflow: hidden; }
  * { box-sizing: border-box; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="app-tokens.jsx"></script>
<script type="text/babel" src="app-daily-b.jsx"></script>

<script type="text/babel" data-presets="env,react">
  function PhoneCol({ label, tab }) {
    const [t, setT] = React.useState(tab);
    return (
      <div className="col">
        <div className="scaled-wrap">
          <div className="scaled">
            <IOSDevice width={402} height={874}>
              <DailyB tab={t} setTab={setT}/>
            </IOSDevice>
          </div>
        </div>
        <div className="label">{label}</div>
      </div>
    );
  }

  function Export() {
    // Apply hyflow palette + brand orange #FF9302 (saved tweak state)
    React.useEffect(() => {
      if (window.KID_PALETTES) {
        const next = window.KID_PALETTES.hyflow;
        for (const key of Object.keys(window.KID_PALETTE)) {
          Object.assign(window.KID_PALETTE[key], next[key]);
        }
        window.AMATTA.primary = '#FF9302';
      }
    }, []);
    return (
      <div className="row">
        <PhoneCol label="01 · 일정"          tab="schedule"/>
        <PhoneCol label="02 · 준비물 & 할일" tab="todo"/>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Export/>);
</script>
</body>
</html>
