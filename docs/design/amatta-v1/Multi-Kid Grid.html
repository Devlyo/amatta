<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>아마따 · 멀티 자녀 그리드</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap"/>
<link rel="stylesheet" href="fonts.css"/>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
    background: #1a1a1a;
    overflow: hidden;
    font-family: 'Pretendard', -apple-system, system-ui, sans-serif;
  }
  body { display: flex; align-items: center; justify-content: center; }
  #stage { transform-origin: center center; will-change: transform; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="stage"><div id="root"></div></div>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="app-tokens.jsx"></script>
<script type="text/babel" src="app-weekly-drawers.jsx"></script>
<script type="text/babel" src="app-daily-b.jsx"></script>
<script type="text/babel" src="app-weekly.jsx"></script>
<script type="text/babel" src="app-multi-grid.jsx"></script>

<script type="text/babel" data-presets="env,react">
  function PhoneShell({ children }) {
    return <IOSDevice width={402} height={874}>{children}</IOSDevice>;
  }

  function App() {
    const [tab, setTab] = React.useState('schedule');
    return (
      <PhoneShell>
        <MultiKidGridB tab={tab} setTab={setTab} onModeSwitch={() => { window.location.href = 'Daily View B.html'; }}/>
      </PhoneShell>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
  // Fit-to-viewport scaling
  (function() {
    const PHONE_W = 402, PHONE_H = 874, PAD = 16;
    const stage = document.getElementById('stage');
    function fit() {
      if (!stage) return;
      const sx = (window.innerWidth - PAD * 2) / PHONE_W;
      const sy = (window.innerHeight - PAD * 2) / PHONE_H;
      const s = Math.min(1, sx, sy);
      stage.style.transform = `scale(${s})`;
    }
    fit();
    window.addEventListener('resize', fit);
    [50, 200, 500, 1000].forEach(t => setTimeout(fit, t));
    if (window.ResizeObserver) new ResizeObserver(fit).observe(document.body);
  })();
</script>
</body>
</html>
