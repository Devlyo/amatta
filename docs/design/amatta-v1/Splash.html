<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>아마따 · 시작화면</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
  @font-face {
    font-family: 'Paperlogy';
    font-weight: 900;
    font-style: normal;
    font-display: block;
    src:
      url('https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy-9Black.woff2') format('woff2'),
      url('https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy-9Black.woff') format('woff'),
      url('https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy-9Black.ttf') format('truetype');
  }
  @font-face {
    font-family: 'Paperlogy';
    font-weight: 700;
    font-style: normal;
    font-display: block;
    src:
      url('https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy-7Bold.woff2') format('woff2'),
      url('https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy-7Bold.woff') format('woff');
  }
  @font-face {
    font-family: 'Paperlogy';
    font-weight: 400;
    font-style: normal;
    font-display: block;
    src:
      url('https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy-4Regular.woff2') format('woff2'),
      url('https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy-4Regular.woff') format('woff');
  }
</style>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
    background: #1a1a1a;
    overflow: hidden;
    font-family: 'Paperlogy', -apple-system, system-ui, sans-serif;
  }
  body { display: flex; align-items: center; justify-content: center; }
  #stage {
    transform-origin: center center;
    will-change: transform;
  }
  .phone {
    width: 402px; height: 874px;
    border-radius: 48px;
    overflow: hidden;
    background: #FF7144;
    box-shadow: 0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Notch */
  .notch {
    position: absolute;
    top: 11px; left: 50%; transform: translateX(-50%);
    width: 126px; height: 37px; border-radius: 24px;
    background: #000; z-index: 50;
  }
  /* Home indicator */
  .home-bar {
    position: absolute;
    bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 139px; height: 5px; border-radius: 100px;
    background: rgba(255,255,255,0.7);
    z-index: 60;
  }
  /* Status bar — white text on orange */
  .status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 54px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 30px;
    z-index: 20;
    color: #fff;
  }
  .status-bar .time {
    font-family: -apple-system, "SF Pro", system-ui;
    font-weight: 590;
    font-size: 17px;
    padding-top: 18px;
  }
  .status-bar .icons {
    display: flex; gap: 6px; align-items: center;
    padding-top: 18px;
  }
  /* Brand wordmark */
  .wordmark {
    font-family: 'Paperlogy', sans-serif;
    font-weight: 900;
    color: #fff;
    font-size: 36px;
    line-height: 1;
    letter-spacing: -1px;
    text-align: center;
    transform: translateY(-8px);
    display: flex;
    gap: 0;
  }
  .wordmark span {
    display: inline-block;
    opacity: 0;
    transform: translateY(10px);
    animation: amattaCharIn 480ms cubic-bezier(.22,.8,.36,1) forwards;
  }
  .wordmark span:nth-child(1) { animation-delay: 120ms; }
  .wordmark span:nth-child(2) { animation-delay: 280ms; }
  .wordmark span:nth-child(3) { animation-delay: 440ms; }
  .wordmark span:nth-child(4) { animation-delay: 720ms; }
  .wordmark .bang {
    color: #fff;
    margin-left: 2px;
  }
  @keyframes amattaCharIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div id="stage">
  <div class="phone">
    <div class="status-bar">
      <span class="time">9:41</span>
      <span class="icons">
        <svg width="19" height="12" viewBox="0 0 19 12"><rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill="#fff"/><rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill="#fff"/><rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill="#fff"/><rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill="#fff"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="#fff" stroke-opacity="0.4" fill="none"/><rect x="2" y="2" width="20" height="9" rx="2" fill="#fff"/><path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill="#fff" fill-opacity="0.4"/></svg>
      </span>
    </div>
    <div class="notch"></div>
    <div class="wordmark"><span>아</span><span>마</span><span>따</span><span class="bang">!</span></div>
    <div class="home-bar"></div>
  </div>
</div>

<script>
  (function() {
    const PHONE_W = 402, PHONE_H = 874, PAD = 16;
    const stage = document.getElementById('stage');
    function fit() {
      if (!stage) return;
      const sx = (window.innerWidth - PAD * 2) / PHONE_W;
      const sy = (window.innerHeight - PAD * 2) / PHONE_H;
      const s = Math.min(1, sx, sy);
      stage.style.transform = `scale(${s})`;
    }
    fit();
    window.addEventListener('resize', fit);
    [50, 200, 500, 1000].forEach(t => setTimeout(fit, t));
    if (window.ResizeObserver) new ResizeObserver(fit).observe(document.body);
  })();
</script>
</body>
</html>
