<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>아마따 · 이용약관</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap"/>
<link rel="stylesheet" href="fonts.css"/>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1a1a1a; overflow: hidden; }
  body {
    display: grid; place-items: center;
    font-family: 'Pretendard', -apple-system, system-ui, sans-serif;
  }
  #root { transform-origin: center center; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="app-tokens.jsx"></script>
<script type="text/babel" src="app-settings.jsx"></script>
<script type="text/babel" src="app-settings-kids.jsx"></script>
<script type="text/babel" src="app-settings-legal.jsx"></script>

<script type="text/babel" data-presets="env,react">
  function PhoneShell({ children }) {
    return <IOSDevice width={402} height={874}>{children}</IOSDevice>;
  }

  function App() {
    return (
      <PhoneShell>
        <Terms onBack={() => { window.location.href = 'Settings.html'; }}/>
      </PhoneShell>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
  (function() {
    const PHONE_W = 402, PHONE_H = 874, PAD = 16;
    function fit() {
      const root = document.getElementById('root');
      if (!root) return;
      const sx = (window.innerWidth - PAD * 2) / PHONE_W;
      const sy = (window.innerHeight - PAD * 2) / PHONE_H;
      const s = Math.min(1, sx, sy);
      root.style.transform = `scale(${s})`;
    }
    fit();
    window.addEventListener('resize', fit);
    window.addEventListener('load', fit);
    setTimeout(fit, 100);
  })();
</script>
</body>
</html>
